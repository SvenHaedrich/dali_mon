[project]
name = "dali-mon"
version = "1.7.0"
description = "Monitor for DALI commands."
authors = [{ name = "Sven Hädrich", email = "sven.haedrich@sevenlab.de" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pyusb",
    "termcolor",
    "click",
    "bitstring",
    "typeguard",
    "pyserial",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]

[project.urls]
repository = "https://github.com/SvenHaedrich/dali_mon"
issues = "https://github.com/SvenHaedrich/dali_mon/issues"
changelog = "https://github.com/SvenHaedrich/dali_mon/blob/main/changelog.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The scripts run from the source tree, the project is installed for its dependencies only.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff.lint]
# never complain about line length violations
ignore = ["E501"]
